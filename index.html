
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherNow | Wetter</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f8fc;
    color: #17324d;
}

header {
    background: white;
    padding: 22px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #1675d1;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #1675d1;
}

.logo span {
    color: #e64b55;
}

.search {
    display: flex;
    gap: 8px;
}

input {
    padding: 12px;
    border: 1px solid #d5e1ee;
    border-radius: 8px;
    width: 180px;
}

button {
    background: #1675d1;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #105ba5;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.weather-card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 5px 25px #dce6f1;
    text-align: center;
    border-top: 5px solid #1675d1;
}

.city {
    font-size: 30px;
    margin-bottom: 15px;
}

.temperature {
    font-size: 75px;
    font-weight: bold;
    color: #1675d1;
    margin: 15px;
}

.description {
    font-size: 20px;
    color: #65788c;
}

.weather-icon {
    font-size: 65px;
    margin: 15px;
}

.details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 30px;
}

.detail {
    background: #f1f7fd;
    padding: 22px;
    border-radius: 12px;
}

.detail h3 {
    color: #1675d1;
    margin-bottom: 10px;
}

.forecast-title {
    margin: 35px 0 20px;
    font-size: 24px;
}

.forecast {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.day {
    background: white;
    text-align: center;
    padding: 20px 10px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #e1e9f2;
}

.day .icon {
    font-size: 32px;
    margin: 12px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #7b8da0;
    border-top: 1px solid #dce6f1;
}

@media(max-width: 650px) {
    header {
        flex-direction: column;
        gap: 18px;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .forecast {
        grid-template-columns: repeat(2, 1fr);
    }

    .temperature {
        font-size: 60px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Weather<span>Now</span></div>

    <div class="search">
        <input id="cityInput" type="text"
        placeholder="Stadt suchen...">
        <button onclick="searchCity()">Suchen</button>
    </div>
</header>

<div class="container">

    <div class="weather-card">

        <h2 class="city" id="city">Hannover, Deutschland</h2>

        <div class="weather-icon" id="icon">🌤️</div>

        <div class="temperature" id="temperature">--°C</div>

        <div class="description" id="description">
            Wetter wird geladen...
        </div>

        <div class="details">

            <div class="detail">
                <h3>💧 Luftfeuchtigkeit</h3>
                <p id="humidity">--%</p>
            </div>

            <div class="detail">
                <h3>🌬️ Windgeschwindigkeit</h3>
                <p id="wind">-- km/h</p>
            </div>

            <div class="detail">
                <h3>🌡️ Gefühlt</h3>
                <p id="feels">--°C</p>
            </div>

        </div>
    </div>

    <h2 class="forecast-title">5-Tage-Vorhersage</h2>

    <div class="forecast" id="forecast"></div>

</div>

<footer>
    © 2026 WeatherNow | Wetter weltweit
</footer>

<script>

const weatherCodes = {
    0: ["Klarer Himmel", "☀️"],
    1: ["Überwiegend klar", "🌤️"],
    2: ["Teilweise bewölkt", "⛅"],
    3: ["Bewölkt", "☁️"],
    45: ["Nebelig", "🌫️"],
    48: ["Nebel", "🌫️"],
    51: ["Leichter Nieselregen", "🌦️"],
    61: ["Leichter Regen", "🌧️"],
    63: ["Mäßiger Regen", "🌧️"],
    65: ["Starker Regen", "🌧️"],
    71: ["Leichter Schneefall", "🌨️"],
    73: ["Schneefall", "❄️"],
    75: ["Starker Schneefall", "❄️"],
    80: ["Regenschauer", "🌦️"],
    95: ["Gewitter", "⛈️"]
};

async function searchCity() {
    const cityName =
        document.getElementById("cityInput").value.trim();

    if (!cityName) return;

    try {
        const geo = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=de&format=json`
        );

        const geoData = await geo.json();

        if (!geoData.results || !geoData.results.length) {
            alert("Stadt nicht gefunden!");
            return;
        }

        const place = geoData.results[0];

        await loadWeather(
            place.latitude,
            place.longitude,
            place.name,
            place.country
        );

    } catch (error) {
        alert("Verbindungsfehler!");
    }
}

async function loadWeather(lat, lon, name, country) {
    try {
        const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`
        );

        const data = await response.json();

        const current = data.current;

        document.getElementById("city").textContent =
            `${name}, ${country}`;

        document.getElementById("temperature").textContent =
            Math.round(current.temperature_2m) + "°C";

        document.getElementById("humidity").textContent =
            current.relative_humidity_2m + "%";

        document.getElementById("wind").textContent =
            current.wind_speed_10m + " km/h";

        document.getElementById("feels").textContent =
            Math.round(current.apparent_temperature) + "°C";

        const weather = weatherCodes[current.weather_code]
            || ["Wetterinformation", "🌤️"];

        document.getElementById("description").textContent =
            weather[0];

        document.getElementById("icon").textContent =
            weather[1];

        const forecast = document.getElementById("forecast");
        forecast.innerHTML = "";

        for (let i = 1; i < 6; i++) {
            const code = data.daily.weather_code[i];
            const info = weatherCodes[code] ||
                ["Wetterinformation", "🌤️"];

            const date = new Date(
                data.daily.time[i] + "T12:00:00"
            );

            const dayName = date.toLocaleDateString(
                "de-DE", { weekday: "short" }
            );

            forecast.innerHTML += `
                <div class="day">
                    <h3>${dayName}</h3>
                    <div class="icon">${info[1]}</div>
                    <p>${info[0]}</p>
                    <br>
                    <strong>
                    ${Math.round(data.daily.temperature_2m_max[i])}°
                    /
                    ${Math.round(data.daily.temperature_2m_min[i])}°
                    </strong>
                </div>
            `;
        }

    } catch (error) {
        document.getElementById("description").textContent =
            "Wetterdaten konnten nicht geladen werden.";
    }
}

loadWeather(52.3759, 9.7320, "Hannover", "Deutschland");

</script>

</body>
</html>
